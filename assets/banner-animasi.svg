<radialGradient id="glow" cx="0.82" cy="0.2" r="0.6"><stop offset="0" stop-color="#e5e5ea" stop-opacity="0.5"/><stop offset="1" stop-color="#e5e5ea" stop-opacity="0"/></radialGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4d4d8" stop-opacity="0"/><stop offset="0.5" stop-color="#f4f4f5"/><stop offset="1" stop-color="#d4d4d8" stop-opacity="0"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="1200" height="240" rx="18"/></clipPath>
