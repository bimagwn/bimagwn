<style>
.s{fill:#fff;opacity:.15;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.95}}
.ring{fill:none;stroke:#fff;stroke-opacity:.11;transform-box:fill-box;transform-origin:center;animation:pulse 7s ease-in-out infinite}
.r2{animation-delay:-2.3s}.r3{animation-delay:-4.6s}
@keyframes pulse{0%,100%{transform:scale(.94);stroke-opacity:.07}50%{transform:scale(1.06);stroke-opacity:.2}}
.name{font-family:Georgia,'Times New Roman',serif;font-size:62px;font-weight:700;fill:#fff;letter-spacing:1px;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
.sub{font-family:'Segoe UI',Arial,sans-serif;font-size:21px;fill:#d4d4d8;letter-spacing:3px;animation:rise 1.4s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ln{transform-box:fill-box;transform-origin:center;animation:grow 1.6s .3s ease-out both}
@keyframes grow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.sw{animation:sweep 5.5s 1.2s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-420px) skewX(-18deg)}55%,100%{transform:translateX(1400px) skewX(-18deg)}}
.fl{animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
</style>
